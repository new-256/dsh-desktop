# dsh-mobile-relay 一键部署（Docker Compose）
# 用法：RELAY_KEY=<强随机密钥> docker compose up -d
# 公网形态建议前置 Nginx/Caddy 反代做 TLS（见 README），对外只暴露 443/wss。
services:
  relay:
    build: .
    container_name: dsh-mobile-relay
    restart: unless-stopped
    environment:
      # 中继密钥（特权凭证，务必强随机：openssl rand -hex 32）
      RELAY_KEY: ${RELAY_KEY:?请设置 RELAY_KEY 环境变量}
    ports:
      - "8443:8443"
    # 若用反代则不需要暴露端口：
    # ports: []
    # networks: [proxy]
    # networks:
    #   proxy:
    #     external: true
