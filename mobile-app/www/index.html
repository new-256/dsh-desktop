<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>DSH 移动工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部状态与导航栏 -->
  <header class="app-header">
    <div class="header-content">
      <div class="brand-zone">
        <span class="brand-logo">✦</span>
        <h1 class="app-title" id="header-title">DSH 工作台</h1>
      </div>
      <div class="header-actions">
        <button id="btn-header-action" class="icon-button" title="刷新列表" aria-label="刷新">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="app-main">
    <!-- 视图 1：实例列表视图（首页） -->
    <section id="view-instances" class="view active">
      <div class="section-title-bar">
        <h2>已保存的实例</h2>
        <span id="instance-count" class="badge">0</span>
      </div>

      <!-- 实例卡片容器 -->
      <div id="instances-list" class="cards-list"></div>

      <!-- 空状态 -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">📱</div>
        <h3>暂无连接的 DSH 实例</h3>
        <p>在 PC 端 DSH 打开「设置 → 移动配对」，扫描二维码或复制配对信息以开始连接。</p>
        <button id="btn-empty-add" class="btn btn-primary">立即添加实例</button>
      </div>

      <!-- 底部固定浮动操作栏 -->
      <div class="bottom-bar">
        <button id="btn-go-pair" class="btn btn-primary btn-block">
          <span class="btn-icon">+</span> 添加新实例
        </button>
      </div>
    </section>

    <!-- 视图 2：配对视图 -->
    <section id="view-pair" class="view">
      <div class="nav-back-bar">
        <button id="btn-back-to-list" class="btn-back" title="返回列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>返回实例列表</span>
        </button>
      </div>

      <div class="pair-card">
        <div class="form-group">
          <div class="label-row">
            <label for="pair-input">配对信息或链接</label>
            <button id="btn-paste-clipboard" type="button" class="text-button">从剪贴板粘贴</button>
          </div>
          <textarea
            id="pair-input"
            rows="4"
            placeholder="支持粘贴：&#10;1. 深链 (dshpair://...)&#10;2. 配对 JSON ({v:1, type:'dsh-pair'...})&#10;3. 网页链接 (http://host:port/?token=...)"
            spellcheck="false"
          ></textarea>
          <div class="form-hint">在桌面端 DSH 设置中点击「复制配对信息」或「复制链接」</div>

          <!-- 快捷识别入口：扫码 / 相册 -->
          <div class="pair-quick-actions">
            <button id="btn-scan-qr" type="button" class="btn btn-primary btn-quick">
              <span class="btn-icon">⛶</span> 扫码配对
            </button>
            <button id="btn-album-qr" type="button" class="btn btn-secondary btn-quick">
              <span class="btn-icon">🖼</span> 从相册识别二维码
            </button>
          </div>
          <input type="file" id="qr-file-input" accept="image/*" class="hidden-file-input" aria-hidden="true" tabindex="-1">
        </div>

        <!-- 识别结果预览卡片 -->
        <div id="parse-preview-box" class="preview-box hidden">
          <div class="preview-header">
            <span class="status-dot"></span>
            <span class="preview-status-text">已识别实例</span>
          </div>
          <div class="preview-row">
            <span class="preview-label">实例名称：</span>
            <span id="preview-name" class="preview-val">-</span>
          </div>
          <div class="preview-row">
            <span class="preview-label">服务地址：</span>
            <span id="preview-origin" class="preview-val font-mono">-</span>
          </div>
          <div class="preview-row">
            <span class="preview-label">凭据状态：</span>
            <span id="preview-token-status" class="preview-val">-</span>
          </div>
        </div>

        <!-- 设备名称配置 -->
        <div class="form-group">
          <label for="device-name-input">本机设备名称</label>
          <div class="input-with-action">
            <input
              type="text"
              id="device-name-input"
              maxlength="40"
              placeholder="例如：Phone-A1B2"
            />
            <button id="btn-random-name" type="button" class="btn btn-secondary btn-sm" title="随机生成名称">随机</button>
          </div>
          <div class="form-hint">用于在 DSH 桌面端已连接设备列表中标识本机</div>
        </div>

        <!-- 配对操作按钮 -->
        <div class="pair-actions">
          <button id="btn-do-pair" class="btn btn-primary btn-block" disabled>
            配对并连接
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 二维码扫描遮罩（原生相机模式：相机渲染在 WebView 之下；Web 回退模式：getUserMedia + jsQR） -->
  <div id="qr-scan-overlay" class="qr-scan-overlay hidden" aria-hidden="true">
    <video id="qr-scan-video" class="qr-scan-video hidden" playsinline muted autoplay></video>
    <canvas id="qr-scan-canvas" class="qr-scan-canvas" aria-hidden="true"></canvas>

    <div class="qr-scan-mask">
      <div class="qr-scan-window">
        <span class="qr-corner tl"></span>
        <span class="qr-corner tr"></span>
        <span class="qr-corner bl"></span>
        <span class="qr-corner br"></span>
        <div class="qr-scan-line"></div>
      </div>
    </div>

    <div class="qr-scan-footer">
      <div id="qr-scan-tip" class="qr-scan-tip">正在启动相机...</div>
      <button id="btn-cancel-scan" type="button" class="btn btn-ghost btn-sm">取消</button>
    </div>
  </div>

  <!-- 全屏加载遮罩 -->
  <div id="loading-overlay" class="loading-overlay hidden" aria-live="assertive">
    <div class="loading-dialog">
      <div class="spinner"></div>
      <div id="loading-title" class="loading-title">正在处理...</div>
      <div id="loading-desc" class="loading-desc">请稍候</div>
      <button id="btn-cancel-loading" class="btn btn-ghost btn-sm">取消并返回</button>
    </div>
  </div>

  <!-- 隐藏 iframe 挂载容器（用于 token 一次性交换） -->
  <div id="token-exchange-host" class="hidden-exchange-host" aria-hidden="true"></div>

  <!-- Toast 消息容器 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- 离线内置二维码解码库（无 CDN 依赖） -->
  <script src="vendor/jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
